{% extends "base.html" %}
{% block title %}{{ action }} Merchant — Project Tracker{% endblock %}
{% block content %}
<h1>{{ action }} Merchant</h1>

{% if errors %}
<div class="alert alert-danger">
    <ul class="mb-0">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>
</div>
{% endif %}

<form method="POST">
    <div class="mb-3">
        <label for="name" class="form-label">Name <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="name" name="name" value="{{ merchant.name or '' }}" required>
    </div>
    <div class="mb-3">
        <label for="website" class="form-label">Website</label>
        <input type="url" class="form-control" id="website" name="website" value="{{ merchant.website or '' }}" placeholder="https://...">
    </div>
    <div class="mb-3">
        <label for="notes" class="form-label">Notes</label>
        <textarea class="form-control" id="notes" name="notes" rows="2">{{ merchant.notes or '' }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">{% if action == 'Create' %}Create{% else %}Save{% endif %}</button>
    <a href="/merchants" class="btn btn-outline-secondary ms-2">Cancel</a>
</form>
{% endblock %}
